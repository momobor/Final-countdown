<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Last Semester</title>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:#fdf3ff;
overflow-x:hidden;
}

/* CHAOTIC BACKGROUND */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 10% 20%, #ffd6ec 0%, transparent 40%),
radial-gradient(circle at 80% 30%, #d6e4ff 0%, transparent 40%),
radial-gradient(circle at 40% 80%, #e8d6ff 0%, transparent 40%);
z-index:-1;
}

.container{
text-align:center;
padding:40px 20px;
}

h1{
font-family:'Permanent Marker',cursive;
font-size:48px;
}

.toggle{
display:inline-flex;
background:white;
border-radius:50px;
padding:5px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
margin-bottom:20px;
}

.toggle button{
border:none;
padding:10px 20px;
border-radius:50px;
cursor:pointer;
background:none;
font-weight:600;
transition:.3s;
}

.toggle button.active{
background:#e8d6ff;
}

.countdown{
font-size:70px;
font-weight:700;
margin:20px 0;
}

.primary{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ffd6ec;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.primary:hover{
transform:scale(1.05);
}

/* MEMORY STRIP */

.memory-strip{
margin-top:60px;
overflow:hidden;
position:relative;
}

.memory-track{
display:flex;
gap:20px;
animation:scroll 50s linear infinite;
}

.polaroid{
background:white;
padding:10px 10px 40px;
width:220px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
transform:rotate(-3deg);
position:relative;
transition:.3s;
}

.polaroid:nth-child(even){
transform:rotate(3deg);
}

.polaroid:hover{
transform:scale(1.08) rotate(0deg);
z-index:5;
}

.polaroid img{
width:100%;
height:160px;
object-fit:cover;
}

.caption{
position:absolute;
bottom:10px;
left:0;
right:0;
font-family:'Permanent Marker';
display:none;
}

.polaroid:hover .caption{
display:block;
}

.delete-btn{
position:absolute;
top:5px;
right:8px;
cursor:pointer;
font-weight:bold;
color:red;
}

@keyframes scroll{
from{transform:translateX(0);}
to{transform:translateX(-50%);}
}

/* FORM */

.form-section{
margin-top:60px;
padding:30px;
background:rgba(255,255,255,0.7);
border-radius:20px;
backdrop-filter:blur(10px);
}

input,textarea{
width:90%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

/* CALENDAR */

.calendar-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:none;
justify-content:center;
align-items:center;
}

.calendar{
background:white;
padding:20px;
border-radius:20px;
width:95%;
max-width:800px;
max-height:90vh;
overflow:auto;
}

.calendar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.day-name{
font-weight:bold;
}

.day{
padding:10px;
border-radius:10px;
cursor:pointer;
background:#f3e8ff;
position:relative;
}

.holiday{
background:#ffd6ec;
}

.longweekend{
outline:3px solid #ff8bd1;
}

.note{
font-size:10px;
margin-top:5px;
}

/* TAPE PLAYER */

.player{
position:fixed;
bottom:20px;
right:20px;
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
width:220px;
}

.player button{
margin:5px;
border:none;
padding:5px 10px;
border-radius:8px;
cursor:pointer;
}

.track-name{
font-size:12px;
margin-top:5px;
}

/* CONFETTI */

.confetti{
position:fixed;
width:10px;
height:10px;
animation:fall 3s linear infinite;
}

@keyframes fall{
to{transform:translateY(100vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="container">
<h1>Our Last Semester</h1>

<div class="toggle">
<button id="mode1" class="active">Last Working Day</button>
<button id="mode2">Final Exam Day</button>
</div>

<div class="countdown" id="countdown"></div>
<button class="primary" onclick="openCalendar()">Open Calendar</button>

<div class="memory-strip">
<div class="memory-track" id="memoryTrack"></div>
</div>

<div class="form-section">
<h2>Add a Memory</h2>
<input type="text" id="memoryText" placeholder="Write something (optional)">
<input type="file" id="memoryImage">
<button class="primary" onclick="addMemory()">Add</button>
</div>
</div>

<div class="calendar-modal" id="calendarModal">
<div class="calendar">
<div class="calendar-header">
<button onclick="prevMonth()">◀</button>
<h2 id="monthYear"></h2>
<button onclick="nextMonth()">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
<button class="primary" onclick="closeCalendar()">Close</button>
</div>
</div>

<div class="player">
<div><strong>Mixtape</strong></div>
<button onclick="prevSong()">⏮</button>
<button onclick="togglePlay()">⏯</button>
<button onclick="nextSong()">⏭</button>
<div class="track-name" id="trackName"></div>
</div>

<script>
/* COUNTDOWN */

let targetDate=new Date("2026-05-09");

document.getElementById("mode1").onclick=function(){
targetDate=new Date("2026-05-09");
mode1.classList.add("active");
mode2.classList.remove("active");
}

document.getElementById("mode2").onclick=function(){
targetDate=new Date("2026-05-30");
mode2.classList.add("active");
mode1.classList.remove("active");
}

function updateCountdown(){
const now=new Date();
const diff=targetDate-now;
const days=Math.ceil(diff/(1000*60*60*24));
document.getElementById("countdown").innerText=days+" days";
if(days<=0) launchConfetti();
}
setInterval(updateCountdown,1000);
updateCountdown();

/* MEMORIES */

let memories=JSON.parse(localStorage.getItem("memories"))||[];

function addMemory(){
const text=document.getElementById("memoryText").value;
const file=document.getElementById("memoryImage").files[0];
if(!file) return;
const reader=new FileReader();
reader.onload=function(e){
memories.push({text,img:e.target.result});
localStorage.setItem("memories",JSON.stringify(memories));
renderMemories();
}
reader.readAsDataURL(file);
}

function deleteMemory(index){
memories.splice(index,1);
localStorage.setItem("memories",JSON.stringify(memories));
renderMemories();
}

function renderMemories(){
const track=document.getElementById("memoryTrack");
track.innerHTML="";
memories.forEach((m,i)=>{
track.innerHTML+=`
<div class="polaroid">
<span class="delete-btn" onclick="deleteMemory(${i})">✕</span>
<img src="${m.img}">
<div class="caption">${m.text||""}</div>
</div>`;
});
}
renderMemories();

/* CALENDAR */

let currentMonth=new Date().getMonth();
let currentYear=2026;

const holidays=[
"2026-01-15","2026-01-26","2026-03-19","2026-03-21",
"2026-04-03","2026-04-14","2026-04-20","2026-05-01",
"2026-05-28"
];

let notes=JSON.parse(localStorage.getItem("notes"))||{};

function generateCalendar(){
const grid=document.getElementById("calendarGrid");
grid.innerHTML="";
document.getElementById("monthYear").innerText=
new Date(currentYear,currentMonth).toLocaleString("default",{month:"long",year:"numeric"});

["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
grid.innerHTML+=`<div class="day-name">${d}</div>`;
});

const firstDay=new Date(currentYear,currentMonth,1).getDay();
const daysInMonth=new Date(currentYear,currentMonth+1,0).getDate();

for(let i=0;i<firstDay;i++){
grid.innerHTML+="<div></div>";
}

for(let d=1;d<=daysInMonth;d++){
const dateObj=new Date(currentYear,currentMonth,d);
const dateStr=dateObj.toISOString().split("T")[0];
const dayDiv=document.createElement("div");
dayDiv.className="day";
dayDiv.innerHTML=d;

if(dateObj.getDay()==0) dayDiv.classList.add("holiday");
if(dateObj.getDay()==6 && Math.ceil(d/7)==3) dayDiv.classList.add("holiday");
if(holidays.includes(dateStr)) dayDiv.classList.add("holiday");

let key=dateObj.toDateString();
if(notes[key]){
let n=document.createElement("div");
n.className="note";
n.innerText=notes[key];
dayDiv.appendChild(n);
}

dayDiv.onclick=function(){
let note=prompt("Add / edit note:");
if(note){
notes[key]=note;
localStorage.setItem("notes",JSON.stringify(notes));
generateCalendar();
}
}

grid.appendChild(dayDiv);
}
}

function prevMonth(){
currentMonth--;
if(currentMonth<0){currentMonth=11;currentYear--;}
generateCalendar();
}

function nextMonth(){
currentMonth++;
if(currentMonth>11){currentMonth=0;currentYear++;}
generateCalendar();
}

function openCalendar(){
document.getElementById("calendarModal").style.display="flex";
generateCalendar();
}

function closeCalendar(){
document.getElementById("calendarModal").style.display="none";
}

/* MUSIC */

const songs=[
{src:"music/song1.mp3",name:"Wiz Khalifa - See You Again ft. Charlie Puth.mp3"},
{src:"music/song2.mp3",name:"Europe - The Final Countdown.mp3"},
];

let currentSong=0;
let audio=new Audio(songs[currentSong].src);
document.getElementById("trackName").innerText=songs[currentSong].name;

function togglePlay(){
if(audio.paused) audio.play();
else audio.pause();
}

function nextSong(){
audio.pause();
currentSong=(currentSong+1)%songs.length;
audio=new Audio(songs[currentSong].src);
document.getElementById("trackName").innerText=songs[currentSong].name;
audio.play();
}

function prevSong(){
audio.pause();
currentSong=(currentSong-1+songs.length)%songs.length;
audio=new Audio(songs[currentSong].src);
document.getElementById("trackName").innerText=songs[currentSong].name;
audio.play();
}

/* CONFETTI */

function launchConfetti(){
for(let i=0;i<120;i++){
const c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},70%,70%)`;
document.body.appendChild(c);
setTimeout(()=>c.remove(),3000);
}
}
</script>
</body>
</html>
